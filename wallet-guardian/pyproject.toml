[project]
name = "wallet-guardian-monitor"
version = "0.4.0rc1"
description = "Read-only wallet monitor and a fixed-version wallet-browser task workbench."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "eth-abi>=5",
    "eth-hash[pycryptodome]>=0.7",
    "eth-utils>=5",
    "httpx>=0.28.1",
]

[project.scripts]
guardian = "guardian.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "guardian"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
